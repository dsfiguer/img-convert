[project]
name = "img-convert"
version = "0.1.0"
description = "A command-line tool for converting raster images in bulk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "typer>=0.9.0",
]

[project.scripts]
img-convert = "img_convert.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img_convert"]
